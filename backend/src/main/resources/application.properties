spring.application.name=events-resources

# DATABASE CONNECTION: where the database is and how to log in.
#
# For now it's PostgreSQL running in Docker on your own laptop. Start it once with:
#   docker run --name events-db -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=events -p 5432:5432 -d postgres:17
#
# These settings must match that Docker command, or Spring can't connect:
#   localhost:5432  = the database is on this computer, on port 5432   (-p 5432:5432)
#   /events         = the database's name                             (POSTGRES_DB=events)
#   postgres        = PostgreSQL's built-in admin user
#   dev             = the password                                    (POSTGRES_PASSWORD=dev)
#
# ${NAME:default} means: "use the environment variable NAME if it's set; otherwise use the default."
# On your laptop nothing is set, so the defaults are used. Later, when we switch to
# Shared Core's central database, we set DB_URL / DB_USER / DB_PASSWORD instead of
# editing this file.
# setting name.url = if DB_    is set use it if not login postGres
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/events}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

# ---------------------------------------------------------------------------
# CREATE TABLES AND SAMPLE DATA AT STARTUP
# "always" = run schema.sql (creates the tables) and data.sql (adds sample events)
# every time the server starts. By default Spring only does this for test databases.
#
# Safe to run every time:
#   schema.sql uses CREATE TABLE IF NOT EXISTS   -> skips tables that already exist
#   data.sql only inserts an event if its title isn't there yet -> no duplicates
# ---------------------------------------------------------------------------
spring.sql.init.mode=always